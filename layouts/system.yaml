display:

  refresh:
    min_interval: 60
    force_interval: 1800

metrics:

  sample_interval: 1.0

  cpu: true
  memory: true
  temperature: true
  gpu: false
  network: true

thresholds:

  cpu: 10

  memory: 5

  temperature: 3

# Experimental only.
# NOVA98 acknowledges cmd 52 but does not render telemetry.
telemetry:

  enabled: false

  interval: 1.0

  force_interval: 5.0

  thresholds:

    cpu: 1
    gpu: 1
    temperature: 1

layout:

  name: system
